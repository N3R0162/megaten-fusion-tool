<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Megami Tensei Fusion Tools</title>
  <meta content="Fusion tool framework for Megami Tensei games." name="description">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
  <script type="text/javascript">
    // Restore links produced by the previous GitHub Pages deployment.
    const params = new URLSearchParams(window.location.search);
    const route = params.get('csr');
    if (route && route.startsWith('/') && !route.startsWith('//') && !route.includes('\\')) {
      params.delete('csr');
      const base = new URL(document.baseURI).pathname.replace(/\/$/, '');
      const query = params.toString();
      window.history.replaceState(null, '', base + route + (query ? '?' + query : '') + window.location.hash);
    }
  </script>
</head>
<body>
  <noscript>This calculator requires JavaScript. Enable JavaScript to view personas and calculate fusion recipes.</noscript>
  <app-root></app-root>
  <div id="loadErrorMsg">
    <p>If this tool does not load:</p>
    <ol>
      <li>Try again in a private browser session.</li>
      <li><a href="https://github.com/aqiu384/megaten-fusion-tool/issues">Report an issue</a> for version commit <code>$COMMIT_HASH</code></li>
    </ol>
  </div>
</body>
</html>
